<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OpenBitFun · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OpenBitFun Mobile · 精确还原 HarmonyOS / iOS 官方实现
   设计令牌来源: src/apps/mobile/harmonyos/entry/src/main/ets/generated/MobileDesignTokens.ets
   ============================================================ */

/* ---------- MobileDesignTokens · Light Theme ---------- */
:root {
  /* MobileDesignColors (light) */
  --page-bg: #FFFFFF;
  --welcome-page-bg: #FFFFFF;
  --ink: #171717;
  --muted: #706F6A;
  --subtle: #A5A39B;
  --line: #E9E7E2;
  --card: #FFFFFF;
  --soft: #F4F3F0;
  --sidebar-bg: #F8F8F9;
  --sidebar-raised: #FFFFFF;
  --sidebar-line: rgba(16, 26, 39, 0.08);   /* #14101A27 */
  --sidebar-hover: #F0F0F2;
  --sidebar-selection: rgba(0, 0, 0, 0.06);  /* FF active: 6% fill, hover 更高以区分层级 */
  --sidebar-ink: rgba(0, 0, 0, 0.80);        /* #CC000000 */
  --sidebar-deep: rgba(0, 0, 0, 0.72);       /* 对话名称：深灰，接近正文 */
  --sidebar-muted: rgba(0, 0, 0, 0.50);      /* 工作区名称：中灰 */
  --sidebar-subtle: rgba(0, 0, 0, 0.35);     /* 分类标签：浅灰 */
  --status-success: #27C46A;
  --scrim: rgba(0, 0, 0, 0.27);              /* #44000000 */
  --shell-scrim: rgba(0, 0, 0, 0.14);        /* #24000000 */

  /* MobileDesignTypography · Fluid Functionalism type ladder (Inter variable) */
  --display-large: 600 24px/30px;
  --display-medium: 600 22px/28px;
  --headline-large: 500 22px/28px;
  --headline-medium: 600 20px/26px;
  --title-large: 600 20px/26px;
  --title-medium: 500 17px/22px;
  --title-small: 500 15px/20px;
  --body-large: 400 16px/24px;
  --body-medium: 400 13px/20px;
  --body-small: 400 12px/18px;
  --label-large: 500 15px/20px;
  --label-medium: 500 13px/20px;
  --label-small: 400 12px/16px;
  --conversation-header-title: 600 17px/22px;

  /* MobileDesignGeometry */
  --conversation-header-height: 76px;
  --conversation-header-compact-height: 64px;
  --control-touch-size: 48px;
  --content-gutter: 16px;
  --sheet-top-radius: 28px;
  --recent-home-gutter: 24px;
  --recent-home-mark-size: 160px;
  --recent-home-title-size: 22px;
  --recent-home-max-width: 560px;
  --recent-home-row-padding: 18px;
  --welcome-max-width: 520px;
  --welcome-gutter: 25px;
  --welcome-header-height: 58px;
  --welcome-button-height: 49px;
  --welcome-button-gap: 11px;
  --welcome-dock-radius: 30px;
  --welcome-dock-bottom: 39px;
  --welcome-mark-size: 92px;

  /* MobileDesignBreakpoints */
  --bp-wide: 600px;
  --bp-extra-wide: 840px;
  --bp-xl: 1440px;

  /* MobileDesignMotion · Fluid Functionalism spring speeds */
  --motion-quick: 180ms;
  --motion-structure: 220ms;
  --ff-fast: 80ms;      /* hover, tooltips, focus rings */
  --ff-moderate: 160ms; /* dropdowns, tabs */
  --ff-slow: 240ms;     /* dialogs, drawers */

  /* Fluid Functionalism geometry */
  --ff-radius: 10px;          /* 控件统一圆角 */
  --ff-control: 36px;         /* default 控件/行高 */
  --ff-control-compact: 28px; /* compact */
  --ff-shadow-card: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --ff-shadow-pop: 0 4px 12px rgba(16,24,40,.08), 0 12px 32px rgba(16,24,40,.10);

  /* Safe areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
button:focus { outline: none; box-shadow: none; }
button:hover { outline: none; }

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", sans-serif;
  font-optical-sizing: auto;
  background: #e5e5ea;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow: hidden;
}

/* ============ 预览控制栏 · segmented control ============ */
.preview-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; flex-shrink: 0;
  background: rgba(229,229,234,.92); backdrop-filter: blur(20px);
  z-index: 100;
}
.preview-bar .label { font-size: 12px; color: var(--muted); font-weight: 500; }
.device-switch {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 3px; border-radius: 999px;
  background: rgba(0,0,0,.05);
  border: 0.5px solid rgba(0,0,0,.06);
}
.device-btn {
  padding: 0 14px; height: 28px; border-radius: 999px;
  font: var(--body-medium); font-weight: 500;
  background: transparent; color: var(--muted);
  transition: background var(--ff-fast) ease, color var(--ff-fast) ease, box-shadow var(--ff-fast) ease;
}
.device-btn:hover { color: var(--ink); }
.device-btn.active { background: var(--ink); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); }

/* ============ 设备容器 (真实设备尺寸) ============ */
.stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 24px 32px; overflow: auto; }
.device-frame {
  position: relative;
  background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
  padding: 10px;
  box-shadow:
    0 24px 64px rgba(0,0,0,.35),
    0 8px 24px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.1);
}
.device-frame::before {
  content: none;
}
.device {
  background: var(--page-bg);
  overflow: hidden;
  clip-path: inset(0 round 47px);
  container-type: inline-size;
  container-name: app;
  position: relative;
  transition: none;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 0 1px rgba(0,0,0,.5);
}
/* iPhone 15 Pro: 393 × 852, 圆角约 47px (屏下摄像头) */
.device-frame[data-mode="slab"]    { width: 413px !important; height: 872px !important; border-radius: 62px !important; }
.device[data-mode="slab"]          { width: 393px !important; height: 852px !important; border-radius: 52px !important; }
/* 双折展开: 接近方形，圆角约 36px */
.device-frame[data-mode="duo"]     { width: 680px !important; height: 740px !important; border-radius: 48px !important; }
.device[data-mode="duo"]           { width: 660px !important; height: 720px !important; border-radius: 38px !important; }
/* 三折叠展开: 宽屏，圆角约 28px */
.device-frame[data-mode="trifold"] { width: min(1044px, 100%) !important; height: 660px !important; border-radius: 40px !important; }
.device[data-mode="trifold"]       { width: 1024px !important; height: 640px !important; border-radius: 30px !important; }

/* ============ App Shell (AppShell.ets 精确还原) ============ */
.app-shell {
  width: 100%; height: 100%;
  position: relative; display: flex;
  overflow: hidden;
  background: var(--sidebar-bg);
}

/* --- Sidebar Floor --- */
.sidebar-floor {
  position: absolute; inset: 0;
  background: var(--sidebar-bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease-out;
  z-index: 1;
}
.sidebar-floor.visible { opacity: 1; }

/* --- Sidebar Panel --- */
.sidebar-panel {
  position: absolute; left: 0; top: 0; bottom: 0;
  z-index: 20;
  background: var(--sidebar-bg);
  display: flex; flex-direction: column;
  opacity: 0;
  transform: translateX(-10%);
  transition: opacity 220ms ease-out, transform 220ms ease-out;
}
.sidebar-panel.open {
  opacity: 1 !important;
  transform: translateX(0) !important;
  transition: opacity 300ms ease-out, transform 300ms ease-out;
}

/* 小屏: 强制侧栏打开状态 (仅直板机) */
@container app (max-width: 599px) {
  .sidebar-panel.open {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    opacity: 1 !important;
    transform: translateX(0) !important;
    z-index: 20 !important;
    transition: none !important;
  }
  .sidebar-panel:not(.open) {
    transition: none !important;
  }
}

/* --- Content Card --- */
.content-card {
  position: absolute; inset: 0;
  background: var(--page-bg);
  z-index: 10;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: border-radius 320ms ease-out, transform 320ms ease-out, box-shadow 320ms ease-out;
}
/* FF overlay 抽屉: 内容卡片保持完整平面, 不推挤不变形 */
.content-card.drawer-open {
  border-radius: 0;
  box-shadow: none;
  transform: none;
}

/* 小屏: 抽屉打开时内容卡片不动, 抽屉右缘投影分层 (仅直板机) */
@container app (max-width: 599px) {
  .content-card.drawer-open {
    border-radius: 0 !important;
    box-shadow: none !important;
    transform: none !important;
    transition: none !important;
  }
  .content-card {
    transition: none !important;
  }
  .sidebar-panel.open {
    box-shadow: 8px 0 24px rgba(16,24,40,.10), 1px 0 0 var(--sidebar-line) !important;
  }
}

/* 常驻侧栏 (双折/三折叠, useMasterDetail = true)
   统一宽度 295px，与直板机抽屉宽度一致 */
@container app (min-width: 840px) {
  .sidebar-floor { display: none; }
  .sidebar-panel {
    position: relative !important;
    opacity: 1 !important;
    transform: none !important;
    width: 295px !important;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    z-index: 1;
    transition: width 0.3s ease, opacity 0.3s ease !important;
  }
  .sidebar-panel.collapsed {
    width: 0 !important;
    border-right: none !important;
    opacity: 0 !important;
    overflow: hidden;
  }
  .content-card {
    position: relative !important; flex: 1;
    border-radius: 0 !important;
    box-shadow: none !important;
    transform: none !important;
    z-index: 10;
    transition: margin-left 0.3s ease;
  }
  .drawer-fab { display: none; }
  .drawer-scrim { display: none; }
}

/* 双折: 常驻侧栏，与直板机/三折叠保持一致宽度 */
@container app (min-width: 600px) and (max-width: 839px) {
  .sidebar-floor { display: none; }
  .sidebar-panel {
    position: relative !important;
    opacity: 1 !important;
    transform: none !important;
    width: 295px !important;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    z-index: 1;
    transition: width 0.3s ease, opacity 0.3s ease !important;
  }
  .sidebar-panel.collapsed {
    width: 0 !important;
    border-right: none !important;
    opacity: 0 !important;
    overflow: hidden;
  }
  .content-card {
    position: relative !important; flex: 1;
    border-radius: 0 !important;
    box-shadow: none !important;
    transform: none !important;
    z-index: 10;
    transition: margin-left 0.3s ease;
  }
  .drawer-fab { display: none; }
  .drawer-scrim { display: none; }
}

/* 小屏: 侧栏宽度 + 覆盖模式 (仅直板机) */
@container app (max-width: 599px) {
  .sidebar-panel:not(.open) {
    width: var(--sidebar-w, 295px) !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    opacity: 0 !important;
    transform: translateX(-10%) !important;
    pointer-events: none !important;
    z-index: 2 !important;
    transition: none !important;
  }
  .sidebar-panel.open {
    width: var(--sidebar-w, 295px) !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    opacity: 1 !important;
    transform: translateX(0) !important;
    pointer-events: auto !important;
    z-index: 20 !important;
    transition: none !important;
  }
}

/* ============ 状态栏 ============ */
/* 状态栏: 系统层级, 绝对定位浮于抽屉/内容之上, 始终可见 */
.statusbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: calc(54px + var(--safe-top));
  padding: var(--safe-top) calc(24px + var(--safe-right)) 0 calc(24px + var(--safe-left));
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px; font-weight: 600; flex-shrink: 0;
  color: var(--ink); z-index: 30;
  pointer-events: none;
}
.statusbar .icons { display: flex; gap: 6px; align-items: center; }

/* ============ 页面容器 ============ */
.pages { flex: 1; position: relative; overflow: hidden; }
.page {
  position: absolute; inset: 0;
  overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column;
  background: var(--page-bg);
  transition: transform 320ms cubic-bezier(.32,.72,.35,1), opacity 320ms;
}
.page.hidden-right {
  transform: translateX(60%);
  opacity: 0;
  pointer-events: none;
  transition: none !important;
}
.page.active {
  transform: translateX(0);
  opacity: 1;
  transition: none !important;
}

/* ============ FF AskUserQuestions ============ */
.ask-user {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--ff-radius);
  padding: 24px;
  margin-bottom: 24px;
}
.ask-user-header {
  font: var(--label-small);
  color: var(--sidebar-subtle);
  margin-bottom: 8px;
}
.ask-user-title {
  font: var(--headline-medium);
  color: var(--ink);
  margin-bottom: 20px;
}
.ask-user-options {
  display: flex;
  flex-direction: column;
}
.ask-user-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background var(--ff-fast) ease;
  margin: 0 -12px;
  padding-left: 12px;
  padding-right: 12px;
  border-radius: var(--ff-radius);
}
.ask-user-option:last-child {
  border-bottom: none;
}
.ask-user-option:hover {
  background: var(--sidebar-hover);
}
.ask-user-option .option-label {
  font: var(--body-medium);
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.ask-user-option .option-desc {
  font: var(--body-medium);
  color: var(--muted);
}
.ask-user-option .option-num {
  font: var(--label-small);
  color: var(--sidebar-subtle);
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--line);
}
.ask-user-option.selected {
  background: var(--sidebar-selection);
}
.ask-user-option.selected .option-num {
  background: var(--ink);
  color: var(--card);
  border-color: var(--ink);
}
.ask-user-footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.ask-user-skip {
  font: var(--body-medium);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  border-radius: var(--ff-radius);
  transition: background var(--ff-fast) ease, color var(--ff-fast) ease;
}
.ask-user-skip:hover {
  background: var(--sidebar-hover);
  color: var(--ink);
}
/* 手机端适配 */
@media (max-width: 599px) {
  .ask-user {
    padding: 16px;
    margin-left: -8px;
    margin-right: -8px;
  }
  .ask-user-option {
    padding: 12px 0;
    margin: 0 -8px;
    padding-left: 8px;
    padding-right: 8px;
  }
  .ask-user-option:active {
    background: var(--sidebar-hover);
  }
}

/* ============ FF Settings Section ============ */
.settings-section {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--ff-radius);
  overflow: hidden;
}
.settings-group {
  padding: 16px 0;
}
.settings-group + .settings-group {
  border-top: 1px solid var(--line);
}
.settings-group-label {
  font: var(--label-small);
  color: var(--sidebar-subtle);
  padding: 0 20px 12px;
}
.settings-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  cursor: pointer;
  transition: background var(--ff-fast) ease;
}
.settings-item:hover {
  background: var(--sidebar-hover);
}
.settings-item:active {
  background: var(--sidebar-selection);
}
.settings-item svg {
  width: 18px;
  height: 18px;
  color: var(--muted);
  flex-shrink: 0;
}
.settings-item span {
  font: var(--body-medium);
  color: var(--ink);
}
.settings-item .arrow {
  margin-left: auto;
  width: 16px;
  height: 16px;
  color: var(--sidebar-subtle);
}
/* 手机端适配 */
@media (max-width: 599px) {
  .settings-section {
    margin-left: -8px;
    margin-right: -8px;
  }
  .settings-item {
    padding: 12px 16px;
  }
  .settings-group-label {
    padding: 0 16px 10px;
  }
}

/* ============ FF Sidebar List ============ */
.sidebar-list {
  width: 100%;
  max-width: 280px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--ff-radius);
  overflow: hidden;
}
.sidebar-search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
}
.sidebar-search svg {
  width: 16px;
  height: 16px;
}
.sidebar-search input {
  flex: 1;
  border: none;
  outline: none;
  font: var(--body-medium);
  color: var(--ink);
  background: transparent;
}
.sidebar-search input::placeholder {
  color: var(--sidebar-subtle);
}
.sidebar-new {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  cursor: pointer;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  transition: background var(--ff-fast) ease;
}
.sidebar-new:hover {
  background: var(--sidebar-hover);
  color: var(--ink);
}
.sidebar-new svg {
  width: 16px;
  height: 16px;
}
.sidebar-group {
  padding: 8px 0;
}
.sidebar-group + .sidebar-group {
  border-top: 1px solid var(--line);
}
.sidebar-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  cursor: pointer;
  transition: background var(--ff-fast) ease;
}
.sidebar-group-header:hover {
  background: var(--sidebar-hover);
}
.sidebar-group-header .group-name {
  font: var(--body-medium);
  font-weight: 500;
  color: var(--ink);
}
.sidebar-group-header .add-btn {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  opacity: 0;
  transition: opacity var(--ff-fast) ease, background var(--ff-fast) ease;
}
.sidebar-group-header:hover .add-btn {
  opacity: 1;
}
.sidebar-group-header .add-btn:hover {
  background: var(--sidebar-selection);
}
.sidebar-group-header .add-btn svg {
  width: 14px;
  height: 14px;
  color: var(--muted);
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 8px 24px;
  cursor: pointer;
  position: relative;
  transition: background var(--ff-fast) ease;
}
.sidebar-item:hover {
  background: var(--sidebar-hover);
}
.sidebar-item:active {
  background: var(--sidebar-selection);
}
.sidebar-item .status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.sidebar-item .status-dot.active {
  background: var(--success);
}
.sidebar-item .status-dot.idle {
  background: var(--sidebar-subtle);
}
.sidebar-item .status-dot.error {
  background: var(--danger);
}
.sidebar-item .item-title {
  flex: 1;
  font: var(--body-medium);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-item.selected {
  background: var(--sidebar-selection);
}
.sidebar-item.selected::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--ink);
}
/* 手机端适配 */
@media (max-width: 599px) {
  .sidebar-list {
    max-width: 100%;
    margin: 0 -8px;
  }
  .sidebar-item {
    padding: 10px 16px 10px 24px;
  }
  .sidebar-group-header .add-btn {
    opacity: 1;
  }
}

/* ============ FF Thinking Path ============ */
.thinking-path {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--ff-radius);
  padding: 20px;
  margin-bottom: 24px;
}
.thinking-header {
  display: flex;
  align-items: center;

.thinking-header svg {

.thinking-steps {

}
.thinking-step:last-child::before {

}
.thinking-step .step-icon {

.thinking-step .step-icon.globe {

.thinking-step .step-title {

/* ============ 页面一：RecentRemoteHome.ets ============ */

.recent-home {

.recent-home-inner {

.brand-flow {

}
.recent-title {

.title-line {

}

}
.recent-head-row {

}

.recent-all-btn { font: var(--body-medium); font-weight: 500; color: var(--ink); height: 44px; padding: 0 4px; border-radius: var(--ff-radius); transition: opacity var(--ff-fast) ease; }
.recent-all-btn:hover { opacity: .7; }
.session-list { width: 100%; }
/* Fluid Functionalism CardGroup: borderless + hairline dividers, fluid hover, no shadow */
.session-row {
  width: 100%; text-align: left;
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 4px;
  border-radius: var(--ff-radius);

}
.session-row:hover { background: var(--soft); }
.session-row:active { background: var(--soft); opacity: .8; }
.session-title { font: var(--title-small); color: var(--ink); transition: font-weight var(--ff-fast) ease; }
.session-row:hover .session-title { font-weight: 600; }

.session-divider { height: 1px; background: var(--line); margin: 0 12px; }

/* ============ ComposerBar (ComposerBar.ets 精确还原) ============ */
/* 外层: 绝对定位钉在页面底部, 宽度铺满, 左右各留 16px */
.composer {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  padding: 8px 16px calc(12px + var(--safe-bottom));
  background: transparent;
  z-index: 15;
}
/* 胶囊: CARD_OVERLAY 80% 白 + 模糊 + 0.5px LINE + 阴影(18/6) */
.composer-pill {
  display: flex; align-items: center; gap: 5px;
  min-height: 56px;
  padding: 4px 8px;
  background: rgba(255,255,255,.80);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 0.5px solid var(--line);
  border-radius: 28px;
  box-shadow: 0 6px 18px rgba(0,0,0,.07);
  transition: border-radius var(--ff-moderate) ease;
}
.composer-pill.expanded { border-radius: 18px; }
/* 加号: COMPOSER_ACTION_SIZE 48 触摸区, 图形 22px ink */
.composer-add {
  width: 48px; height: 48px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  border-radius: 50%;
  transition: background var(--ff-fast) ease;
}
.composer-add:hover { background: var(--soft); }
/* 输入框: bodyLarge 16/24, placeholder muted, 单行折叠 */
.composer-input {
  flex: 1; min-width: 0;
  height: 44px;
  border: none; background: transparent; outline: none;
  font: var(--body-large); color: var(--ink);
  padding: 0 4px;
}
.composer-input::placeholder { color: var(--muted); }
/* 主操作: 48px 触摸区; 空闲 = 麦克风 38% 灰 on SOFT 底; 可发送 = 32px 黑底白箭头 */
.composer-action {
  position: relative;
  width: 48px; height: 48px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--soft);
  color: var(--muted);
  transition: background var(--ff-fast) ease;
}
.composer-action .icon-mic { opacity: .38; transition: opacity var(--ff-fast) ease; }
.composer-action .send-surface {
  position: absolute; inset: 0;
  margin: auto;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--ink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(.6);
  transition: opacity var(--ff-fast) ease, transform var(--ff-fast) cubic-bezier(.34,1.56,.64,1);
}
.composer-action.sendable { background: transparent; }
.composer-action.sendable .icon-mic { opacity: 0; }
.composer-action.sendable .send-surface { opacity: 1; transform: scale(1); }
.composer-action.sendable:active .send-surface { background: var(--muted); }

.miniapp-header {

/* ============ 小应用 · 列表卡片视图 ============ */
/* ============ 小应用 · 列表卡片视图 ============ */
.app-grid {

.app-card {

.app-cover-wrap {

.app-cover-wrap img {

@container app (min-width: 840px) {

}
/* 3D 翻转效果 - 列表模式移除 */
.app-card.flip .app-cover-wrap,
.app-card.flip:hover .app-cover-wrap {

  transition: none;

/* ============ 小应用 · 卡片滑动视图 ============ */
.card-swiper-view {
  width: 100%;
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card-stack {
  width: 100%;
  flex: 1;
  min-height: 0;
  position: relative;
  perspective: 1200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.swiper-card {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(320px, 85vw);
  height: min(420px, 70vh);
  margin-left: calc(min(320px, 85vw) / -2);
  margin-top: calc(min(420px, 70vh) / -2);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.3s ease;
  cursor: grab;
  will-change: transform;
  background: var(--card);
  user-select: none;
}
.swiper-card:active {
  cursor: grabbing;
}
.swiper-card .card-cover {
  width: 100%;
  height: 65%;
  overflow: hidden;
  position: relative;
}
.swiper-card .card-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}
.swiper-card .card-cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.2));
}
.swiper-card .card-icon {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  z-index: 2;
}
.swiper-card .card-info {
  padding: 20px;
  height: 35%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.swiper-card .card-name {
  font: var(--title-large);
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}
.swiper-card .card-desc {
  font: var(--body-medium);
  color: var(--muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* 卡片状态 */
.swiper-card.card-active {
  transform: translateX(0) scale(1) rotateZ(0deg);
  z-index: 3;
  opacity: 1;
}
.swiper-card.card-prev {
  transform: translateX(-100px) scale(0.85) rotateZ(-5deg);
  z-index: 2;
  opacity: 0.6;
  filter: brightness(0.85);
}
.swiper-card.card-next {
  transform: translateX(100px) scale(0.85) rotateZ(5deg);
  z-index: 2;
  opacity: 0.6;
  filter: brightness(0.85);
}
.swiper-card.card-hidden-left {
  transform: translateX(-200px) scale(0.7) rotateZ(-10deg);
  z-index: 1;
  opacity: 0;
}
.swiper-card.card-hidden-right {
  transform: translateX(200px) scale(0.7) rotateZ(10deg);
  z-index: 1;
  opacity: 0;
}
/* 拖拽中 */
.swiper-card.dragging {
  transition: none;
  box-shadow: 0 16px 48px rgba(0,0,0,0.25);
}
/* 指示器 */
.card-indicator {
  display: flex;
  gap: 8px;
  padding: 20px 0 12px;
}
.card-indicator .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--sidebar-subtle);
  opacity: 0.4;
  transition: all 0.3s ease;
}
.card-indicator .dot.active {
  opacity: 1;
  width: 24px;
  border-radius: 4px;
  background: var(--ink);
}
/* 提示文字 */
.card-hint {
  font: var(--label-small);
  color: var(--sidebar-subtle);
  padding-bottom: 16px;
}
/* 视图切换按钮 */
.view-toggle {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--soft);
  color: var(--muted);
  transition: all var(--ff-fast) ease;
}
.view-toggle:hover {
  background: var(--sidebar-hover);
  color: var(--ink);
}
/* 手机端适配 */
@media (max-width: 599px) {
  .card-swiper-view {
    overflow: hidden;
  }
  .swiper-card {
    width: min(280px, 82vw);
    height: min(400px, 65vh);
    margin-left: calc(min(280px, 82vw) / -2);
    margin-top: calc(min(400px, 65vh) / -2);
  }
  .swiper-card.card-prev {
    transform: translateX(-70px) scale(0.82) rotateZ(-5deg);
  }
  .swiper-card.card-next {
    transform: translateX(70px) scale(0.82) rotateZ(5deg);
  }
}

/* 双折适配：卡片缩小适应较窄屏幕 */
@container app (min-width: 600px) and (max-width: 839px) {
  .card-swiper-view {
    overflow: hidden;
  }
  .swiper-card {
    width: min(260px, 75vw);
    height: min(360px, 60vh);
    margin-left: calc(min(260px, 75vw) / -2);
    margin-top: calc(min(360px, 60vh) / -2);
  }
  .swiper-card .card-cover {
    height: 60%;
  }
  .swiper-card .card-info {
    padding: 16px;
  }
  .swiper-card .card-name {
    font-size: 18px;
  }
  .swiper-card .card-desc {
    font-size: 13px;
    -webkit-line-clamp: 2;
  }
  .swiper-card.card-prev {
    transform: translateX(-60px) scale(0.85) rotateZ(-5deg);
  }
  .swiper-card.card-next {
    transform: translateX(60px) scale(0.85) rotateZ(5deg);
  }
}

/* 三折叠适配 */
@container app (min-width: 840px) {
  .swiper-card {
    width: min(340px, 80vw);
    height: min(440px, 65vh);
    margin-left: calc(min(340px, 80vw) / -2);
    margin-top: calc(min(440px, 65vh) / -2);
  }
}

/* 侧栏收起状态 - 带动画 */
.sidebar-panel {
  transition: width 0.3s ease, opacity 0.3s ease;
}
.sidebar-panel.collapsed {
  width: 0 !important;
  min-width: 0 !important;
  border-right: none !important;
  overflow: hidden;
  flex-shrink: 0;
  opacity: 0;
}
.sidebar-panel.collapsed .sidebar-inner {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sidebar-scroll {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
  padding: 8px 0 16px;
}
.sidebar-miniapp-btn {
  width: 100%; height: 40px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 8px;
  border-radius: var(--ff-radius);
  font: 400 16px/24px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-ink);
  outline: none; -webkit-tap-highlight-color: transparent;
  transition: background var(--ff-fast) ease;
}
.sidebar-miniapp-btn .miniapp-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.85; }
.sidebar-miniapp-btn:active { background: var(--sidebar-hover); }
.sidebar-miniapp-btn:focus { outline: none; box-shadow: none; }
.sidebar-miniapp-btn:hover { background: var(--sidebar-hover); }

/* 助理行 · 毕方 IP (FF SidebarMenuButton: 32px 行高, 13px/400, hover 填充) */
.assistant-row {
  width: 100%; height: 40px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 8px;
  border-radius: var(--ff-radius);
  font: 400 16px/24px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-ink);
  outline: none; -webkit-tap-highlight-color: transparent;
  transition: background var(--ff-fast) ease;
}
.assistant-row:hover { background: var(--sidebar-hover); }
.assistant-row:active { background: var(--sidebar-hover); }
.assistant-row .mascot {
  width: 18px; height: 18px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.assistant-row .mascot img { width: 18px; height: 18px; display: block; }
.sidebar-section-label {
  display: flex; align-items: center; justify-content: space-between;
  height: 32px; padding: 12px 8px 0;
  font: var(--label-small); font-weight: 400; color: var(--sidebar-muted);
}
.workspace-label {
  display: flex; align-items: center; justify-content: space-between;
  height: 28px; margin: 20px 8px 6px; padding: 0;
  font: 400 12px/18px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-subtle);
  letter-spacing: 0.02em;
}
.workspace-label .add-btn {
  width: 16px; height: 16px; margin-top: -2px;
  display: flex; align-items: center; justify-content: center;
  color: var(--sidebar-subtle); opacity: 0.6;
  border-radius: 6px;
  transition: background var(--ff-fast) ease, opacity var(--ff-fast) ease;
}
.workspace-label .add-btn:hover { background: var(--sidebar-hover); opacity: 1; }
.ws-row {
  width: 100%; height: 36px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px; border-radius: 8px;
  font: 400 14px/22px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-muted);
  transition: background var(--ff-fast) ease, color var(--ff-fast) ease;
}
.ws-row:hover { background: var(--sidebar-hover); color: var(--sidebar-ink); }
.ws-row:active { background: var(--sidebar-hover); color: var(--sidebar-ink); }
.ws-row .chev-wrap { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform var(--ff-fast) ease; }
.ws-row .chev { color: var(--sidebar-subtle); opacity: 0.5; }
.ws-row .ws-name { text-align: left; }
/* 展开状态：箭头旋转 90°，名称变深色 */
.ws-row.expanded { color: var(--sidebar-ink); }
.ws-row.expanded .chev-wrap { transform: rotate(90deg); }
.ws-row.expanded .chev { opacity: 0.8; }
/* 展开后的子项 */
.ws-children { overflow: hidden; max-height: 0; transition: max-height var(--ff-med) ease; }
.ws-children.open { max-height: 200px; }
.ws-child {
  width: 100%; height: 36px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 28px; border-radius: 8px;
  font: 400 13px/20px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-muted);
  transition: background var(--ff-fast) ease, color var(--ff-fast) ease;
}
.ws-child:hover { background: var(--sidebar-hover); color: var(--sidebar-ink); }
.ws-child .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sidebar-subtle); opacity: 0.5; flex-shrink: 0; }
/* 最近会话（与工作区并列，默认展开） */
.ws-recent-label {
  height: 28px; margin: 24px 8px 8px; padding: 0;
  font: 400 12px/18px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-subtle);
  display: flex; align-items: center; justify-content: flex-start; gap: 6px;
  letter-spacing: 0.02em;
}
.ws-recent-label .collapse-btn {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--sidebar-subtle); opacity: 0.6;
  border-radius: 6px;
  transition: background var(--ff-fast) ease, opacity var(--ff-fast) ease, transform var(--ff-fast) ease;
}
.ws-recent-label .collapse-btn:hover { background: var(--sidebar-hover); opacity: 1; }
.ws-recent-label .collapse-btn svg { transition: transform var(--ff-fast) ease; transform: rotate(90deg); }
.ws-recent-label .collapse-btn.collapsed svg { transform: rotate(0deg); }
.ws-recent-list { overflow: hidden; max-height: 300px; transition: max-height var(--ff-med) ease; }
.ws-recent-list.collapsed { max-height: 0; }
.ws-recent-item {
  width: 100%; height: 40px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px; border-radius: 8px;
  font: 400 15px/22px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-deep);
  transition: background var(--ff-fast) ease, color var(--ff-fast) ease;
}
.ws-recent-item:hover { background: var(--sidebar-hover); color: var(--sidebar-ink); }
.ws-recent-item .item-title { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-recent-item .item-time { font: var(--label-small); color: var(--sidebar-subtle); opacity: 0; flex-shrink: 0; transition: opacity var(--ff-fast) ease; }
.ws-recent-item:hover .item-time { opacity: 0.6; }
/* 状态点：名称右侧，仅运行中/错误显示 */
.ws-recent-item .status-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  margin-left: auto;
}
.ws-recent-item .status-dot.running { background: var(--status-success); }
.ws-recent-item .status-dot.error { background: #FF3B30; }

.sidebar-footer {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 8px;
  min-height: 48px;
  border-top: 0.5px solid var(--sidebar-line);
}
.tool-pill {
  display: flex; align-items: center; gap: 8px;
  min-width: 88px; height: 36px;
  padding: 0 8px;
  background: transparent;
  border: 0.5px solid transparent;
  border-radius: var(--ff-radius);
  font: 400 14px/20px "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: var(--sidebar-muted);
  transition: background var(--ff-fast) ease, border-color var(--ff-fast) ease, color var(--ff-fast) ease;
}
.tool-pill:hover { background: var(--sidebar-hover); border-color: var(--sidebar-line); color: var(--sidebar-ink); }
.settings-btn {
  width: 32px; height: 32px; border-radius: var(--ff-radius);
  background: transparent;
  border: 0.5px solid transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--sidebar-muted);
  margin-left: auto;
  transition: background var(--ff-fast) ease, border-color var(--ff-fast) ease, color var(--ff-fast) ease;
}
.settings-btn:hover { background: var(--sidebar-hover); border-color: var(--sidebar-line); color: var(--sidebar-ink); }

/* ============ 抽屉遮罩 ============ */
.drawer-scrim {
  position: absolute; inset: 0;
  background: var(--scrim);
  z-index: 15; pointer-events: none;
  opacity: 0; transition: opacity 210ms ease-out;
}
.drawer-scrim.visible { opacity: 0.62 !important; pointer-events: auto !important; }

/* 小屏: 抽屉遮罩 (仅直板机) */
@container app (max-width: 599px) {
  .drawer-scrim.visible {
    opacity: 0.62 !important;
    pointer-events: auto !important;
    transition: none !important;
  }
  .drawer-scrim {
    transition: none !important;
  }
}

/* ============ 首页抽屉按钮 ============ */
.drawer-fab {
  position: absolute;
  left: calc(12px + var(--safe-left));
  top: calc(52px + var(--safe-top));
  z-index: 12;
  width: 36px; height: 36px; border-radius: var(--ff-radius);
  background: transparent;
  display: none;
  align-items: center; justify-content: center;
  border: none;
  color: var(--sidebar-muted);
  transition: background var(--ff-fast) ease, color var(--ff-fast) ease;
}
/* 双折/三折叠收起侧栏时显示 */
@container app (min-width: 600px) {
  .sidebar-panel.collapsed ~ .content-card .drawer-fab {
    display: flex;
  }
}
/* 直板机始终显示 */
@container app (max-width: 599px) {
  .drawer-fab {
    display: flex;
  }
}
.drawer-fab:hover {
  background: var(--sidebar-hover);
  color: var(--sidebar-ink);
}
.drawer-fab:active {
  background: var(--sidebar-hover);
  color: var(--sidebar-ink);
}

/* ============ Home Indicator ============ */
.home-indicator {
  position: absolute;
  bottom: calc(8px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px;
  background: rgba(0,0,0,.20); z-index: 40; pointer-events: none;
}

/* ============ 容器查询适配 (ConversationLayoutPolicy) ============ */

/* 列表视图始终单列 */

/* ============ 设备尺寸微调 ============ */
/* 直板机: content-card 圆角与设备圆角匹配 */
@container app (max-width: 599px) {
  .device[data-mode="slab"] {
    border-radius: 47px;
  }
}

/* 双折: 稍小圆角 */
@container app (min-width: 600px) and (max-width: 839px) {
  .device[data-mode="duo"] {
    border-radius: 36px;
  }
}

/* 三折叠: 最小圆角 */
@container app (min-width: 840px) {
  .device[data-mode="trifold"] {
    border-radius: 28px;
  }
}

/* 小屏: 侧栏宽度 + 覆盖模式 (仅直板机) */
@container app (max-width: 599px) {
  .sidebar-panel:not(.open) {
    width: var(--sidebar-w, 295px) !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    opacity: 0 !important;
    transform: translateX(-10%) !important;
    pointer-events: none !important;
    z-index: 2 !important;
    transition: none !important;
  }
  .sidebar-panel.open {
    width: var(--sidebar-w, 295px) !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    opacity: 1 !important;
    transform: translateX(0) !important;
    pointer-events: auto !important;
    z-index: 20 !important;
    transition: none !important;
  }
}
</style>

function attachCardEvents() {
  const cards = cardStack.querySelectorAll('.swiper-card');
  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  let currentCard = null;

  cards.forEach(card => {
    card.addEventListener('pointerdown', (e) => {
      if (!card.classList.contains('card-active')) return;
      isDragging = true;
      currentCard = card;
      startX = e.clientX;
      currentX = startX;
      card.classList.add('dragging');
      card.setPointerCapture(e.pointerId);
    });

    card.addEventListener('pointermove', (e) => {
      if (!isDragging || card !== currentCard) return;
      currentX = e.clientX;
      const diff = currentX - startX;
      card.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
    });

    card.addEventListener('pointerup', (e) => {
      if (!isDragging || card !== currentCard) return;
      isDragging = false;
      card.classList.remove('dragging');
      const diff = e.clientX - startX;

      if (Math.abs(diff) > 80) {
        // 切换卡片
        if (diff > 0 && currentCardIndex > 0) {
          currentCardIndex--;
        } else if (diff < 0 && currentCardIndex < miniApps.length - 1) {
          currentCardIndex++;
        }
        renderCardStack();
      } else {
        // 回弹
        card.style.transform = '';
      }
      currentCard = null;
    });

    card.addEventListener('pointercancel', () => {
      if (card === currentCard) {
        isDragging = false;
        card.classList.remove('dragging');
        card.style.transform = '';
        currentCard = null;
      }
    });
  });
}

/* ============================================================
   WelcomeBrandFlow · Canvas 呼吸动效
   原始 CONTOURS 15 层叠加 + 扫光 + 呼吸脉动

// 呼吸状态控制（全局，提前声明供 setupBrandFlow 使用）
let breathState = 'idle';
function setBreathState(state) {
  breathState = state;
}

function setupBrandFlow() {
  const canvas = document.getElementById('brandCanvas');
  const container = document.getElementById('brandFlow');
  const size = 160;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr * size / 256, dpr * size / 256);

  let phase = 0;
  const cycle = 5000; // 扫光周期
  // 呼吸与打字机节奏同步：打字 1.6s + 停留 3s + 删除 0.8s + 间隔 0.8s ≈ 6.2s
  const BREATH_CYCLE = 6200; // 呼吸周期与打字机完整周期一致
  const BREATH_MIN = 0.96;   // 呼吸最小缩放
  const BREATH_MAX = 1.04;   // 呼吸最大缩放
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 全局相位：由打字机控制，实现呼吸与文字节奏同步
  let globalBreathPhase = 0;
  let lastFrameTime = Date.now();

  function updateBreathPhase(state) {
    // state: 'typing' | 'holding' | 'erasing' | 'idle'
    const now = Date.now();
    const dt = now - lastFrameTime;
    lastFrameTime = now;

    switch(state) {
      case 'typing':
        // 打字时：快速吸气（放大）
        globalBreathPhase = Math.min(1, globalBreathPhase + dt / 1600);
        break;
      case 'holding':
        // 停留时：缓慢呼气（缩小）
        globalBreathPhase = Math.max(0, globalBreathPhase - dt / 3000);
        break;
      case 'erasing':
        // 删除时：快速呼气
        globalBreathPhase = Math.max(0, globalBreathPhase - dt / 800);
        break;
      case 'idle':
        // 间隔时：保持最低
        globalBreathPhase = Math.max(0, globalBreathPhase - dt / 400);
        break;
    }
  }

  function getBreathScale() {
    // 使用平滑的缓动函数
    const t = globalBreathPhase;
    const eased = t * t * (3 - 2 * t); // smoothstep
    return BREATH_MIN + (BREATH_MAX - BREATH_MIN) * eased;
  }

  function paint() {
    ctx.clearRect(0, 0, 256, 256);

    // 更新呼吸相位（与打字机同步）
    if (!reducedMotion) {
      updateBreathPhase(breathState);
    }

    // 呼吸缩放：围绕中心 128,128
    const breathScale = reducedMotion ? 1 : getBreathScale();
    ctx.save();
    ctx.translate(128, 128);
    ctx.scale(breathScale, breathScale);
    ctx.translate(-128, -128);

    // 扫光渐变：高级灰蓝光感，低饱和
    const sweepT = reducedMotion ? 0.5 : ((Date.now() % 5000) / 5000);
    const sweepR = 128 + (sweepT * 2 - 1) * 128;
    const innerR = Math.max(0, sweepR - 50);
    const outerR = Math.min(256, sweepR + 50);
    const gradient = ctx.createRadialGradient(128, 128, innerR, 128, 128, outerR);
    // 高级灰蓝渐变：雾灰 → 银灰 → 月光白，低饱和
    gradient.addColorStop(0, 'rgba(23,23,23,0.04)');
    gradient.addColorStop(0.25, 'rgba(120,125,140,0.08)');
    gradient.addColorStop(0.4, 'rgba(190,195,210,0.25)');
    gradient.addColorStop(0.5, 'rgba(245,247,252,0.9)');
    gradient.addColorStop(0.6, 'rgba(190,195,210,0.25)');
    gradient.addColorStop(0.75, 'rgba(120,125,140,0.08)');
    gradient.addColorStop(1, 'rgba(23,23,23,0.04)');

    ctx.strokeStyle = reducedMotion ? '#171717' : gradient;
    ctx.lineWidth = 1.3;
    CONTOURS.forEach(d => {
      const path = new Path2D(d);
      ctx.stroke(path);
    });
    ctx.restore();
  }

  if (!reducedMotion) {
    function animate() {
      paint();
      requestAnimationFrame(animate);
    }
    animate();
  } else {
    paint();
  }
}

const GREETINGS = [

const TYPE_SPEED = 80;    // 打字速度 ms/字
const ERASE_SPEED = 40;   // 删除速度 ms/字
const HOLD_TIME = 3000;   // 停留时间
const ERASE_DELAY = 800;  // 开始删除前的延迟

function typewriterGreeting() {
  const lines = document.querySelectorAll('.title-line');
  if (!lines.length) return;
  let idx = 0;

  function typeLine(line, text, done) {
    let i = 0;
    line.textContent = '';
    setBreathState('typing'); // 打字时吸气
    function type() {
      if (i < text.length) {
        line.textContent = text.substring(0, ++i);
        setTimeout(type, TYPE_SPEED);
      } else {
        setBreathState('holding'); // 停留时呼气
        setTimeout(done, HOLD_TIME);
      }
    }
    type();
  }

  function eraseLine(line, done) {
    const text = line.textContent;
    let i = text.length;
    setBreathState('erasing'); // 删除时快速呼气
    function erase() {
      if (i > 0) {
        line.textContent = text.substring(0, --i);
        setTimeout(erase, ERASE_SPEED);
      } else {
        setBreathState('idle'); // 间隔时保持
        done();
      }
    }
    erase();
  }

  function cycle() {
    lines.forEach((el, i) => el.classList.toggle('active', i === idx));
    const current = lines[idx];
    const text = GREETINGS[idx];
    typeLine(current, text, () => {
      eraseLine(current, () => {
        idx = (idx + 1) % GREETINGS.length;
        cycle();
      });
    });
  }

  // 初始启动
  cycle();
}

typewriterGreeting();

/* ============================================================
   设备切换
   ============================================================ */
function initSidebarForMode() {
  const w = device.clientWidth;
  // 双折/三折叠：常驻侧栏，默认展开
  if (w >= 600) {
    sidebarPanel.classList.add('open');
    sidebarFloor.classList.add('visible');
    contentCard.classList.add('drawer-open');
  } else {
    // 直板机：默认收起
    closeDrawer();
  }
  updateSidebarWidth();
}

document.querySelectorAll('.device-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.device-btn.active').classList.remove('active');
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    device.dataset.mode = mode;
    document.getElementById('deviceFrame').dataset.mode = mode;
    initSidebarForMode();
  });
});

initSidebarForMode();

/* ============================================================
   ComposerBar · 主操作状态机 (ChatComposerPolicy 对齐)
   空闲 = 麦克风(38% 灰 on SOFT); 有文字/聚焦可发送 = 黑底白箭头
   ============================================================ */
const composerInput = document.getElementById('composerInput');
const composerAction = document.getElementById('composerAction');
const composerPill = document.getElementById('composerPill');

function refreshComposerState() {
  const hasText = composerInput.value.trim().length > 0;
  composerAction.classList.toggle('sendable', hasText);
  composerAction.setAttribute('aria-label', hasText ? '发送' : '语音输入');
  composerPill.classList.toggle('expanded', hasText || document.activeElement === composerInput);
}
composerInput.addEventListener('input', refreshComposerState);
composerInput.addEventListener('focus', refreshComposerState);
composerInput.addEventListener('blur', refreshComposerState);
composerAction.addEventListener('click', () => {
  if (composerInput.value.trim().length > 0) {
    composerInput.value = '';
    refreshComposerState();
    composerInput.focus();
  }
});

/* ============================================================
   状态栏时钟
   ============================================================ */
function tick() {
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 30000);
</script>
