name: Publish Windows Backfill

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Desktop Package run containing the Windows bundle"
        required: true
        type: string
      tag_name:
        description: "Existing release tag to update"
        required: true
        type: string
        default: v1.0.11
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      tag_name:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      TAURI_UPDATER_PUBKEY:
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.tag_name }}
      RELEASE_VERSION: 1.0.11
      OPENBITFUN_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      OPENBITFUN_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      OPENBITFUN_SIGNING_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v1.0.11" ]]
          test -n "$OPENBITFUN_SIGNING_KEY"
          test -n "$OPENBITFUN_SIGNING_PUBKEY"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "bb7afd65fab8ecc6496562a2ea48a0f437bfbd68" '
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            .path == ".github/workflows/desktop-package.yml" and
            .conclusion == "success" and
            (.head_sha == $sha or (.head_sha | test("^[a-f0-9]{40}$")))' source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source-jobs.json
          jq -e '.jobs | any(.name == "Package (windows-x64)" and .conclusion == "success")' source-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-state.json
      - name: Download Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "openbitfun-${RELEASE_TAG}-windows-x64-bundle" --dir release-assets
          find release-assets -type f -print | sort
      - name: Install minisign
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Prepare and sign Windows installers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-windows-installer-asset.mjs \
            --assets-dir release-assets --version "$RELEASE_VERSION" \
            --out-dir release-manual-assets
          bash scripts/sign-release-assets.sh release-manual-assets/*.exe
          node scripts/collect-tauri-updater-assets.mjs \
            --assets-dir release-assets --version "$RELEASE_VERSION" \
            --windows-installer-dir release-manual-assets \
            --out-dir release-updater-assets \
            --required-platforms windows-x86_64
          test -f release-updater-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe
          test -f release-updater-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe.sig
      - name: Rebuild updater manifest with preserved non-Windows entries
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest-v1.json --dir existing-release --clobber
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('existing-release/latest-v1.json', 'utf8'));
          const version = process.env.RELEASE_VERSION;
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = encodeURIComponent(process.env.RELEASE_TAG);
          const updater = `OpenBitFun_${version}_windows-x86_64-setup.exe`;
          const manual = `OpenBitFun_${version}_windows-x86_64-installer.exe`;
          const signature = fs.readFileSync(`release-updater-assets/${updater}.sig`, 'utf8').trim();
          manifest.version = version;
          manifest.pub_date = new Date().toISOString();
          manifest.platforms['windows-x86_64'] = {
            signature,
            url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(updater)}`,
          };
          manifest.manual_installers ??= {};
          manifest.manual_installers['windows-x86_64'] = {
            url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(manual)}`,
            signature_url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(manual)}.sig`,
          };
          fs.writeFileSync('latest-v1.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          node scripts/verify-tauri-latest-json.mjs \
            --manifest latest-v1.json --version "$RELEASE_VERSION" \
            --required-platforms windows-x86_64,darwin-x86_64,darwin-aarch64,linux-x86_64,linux-aarch64,linux-x86_64-deb,linux-aarch64-deb,linux-x86_64-rpm,linux-aarch64-rpm \
            --required-manual-platforms windows-x86_64
      - name: Verify signatures before upload
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern minisign.pub --dir existing-key --clobber
          for asset in \
            "release-updater-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe" \
            "release-manual-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe"; do
            minisign -Vm "$asset" -p existing-key/minisign.pub -x "$asset.sig"
          done
      - name: Replace Windows assets and updater manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release-updater-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe" \
            "release-updater-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe.sig" \
            "release-manual-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe" \
            "release-manual-assets/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe.sig" \
            latest-v1.json
      - name: Read back and verify publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readback
          for name in \
            "OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe" \
            "OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe.sig" \
            "OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe" \
            "OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe.sig" \
            latest-v1.json; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir readback --clobber
            test -s "readback/$name"
          done
          minisign -Vm "readback/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe" \
            -p existing-key/minisign.pub -x "readback/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-setup.exe.sig"
          minisign -Vm "readback/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe" \
            -p existing-key/minisign.pub -x "readback/OpenBitFun_${RELEASE_VERSION}_windows-x86_64-installer.exe.sig"
          node scripts/verify-tauri-latest-json.mjs \
            --manifest readback/latest-v1.json --version "$RELEASE_VERSION" \
            --required-platforms windows-x86_64,darwin-x86_64,darwin-aarch64,linux-x86_64,linux-aarch64,linux-x86_64-deb,linux-aarch64-deb,linux-x86_64-rpm,linux-aarch64-rpm \
            --required-manual-platforms windows-x86_64 --check-urls true
